<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reinbox · Paper</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="{{ c.vars }} width: 100%; min-height: 900px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: Geist, system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; position: relative">

  <header style="height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 20px; box-sizing: border-box">
    <button aria-label="Menú" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--text2); display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </button>
    <div style="display: flex; align-items: center; gap: 10px; width: 188px">
      <div style="width: 28px; height: 28px; border-radius: 9px; background: var(--accent); display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      </div>
      <span style="font-size: 18px; font-weight: 600; letter-spacing: -0.01em">Reinbox</span>
    </div>
    <label style="flex: 0 1 720px; height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); box-sizing: border-box; color: var(--text3)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
      <input placeholder="Buscar en el correo" aria-label="Buscar en el correo" style="flex: 1; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: var(--text)">
    </label>
    <div style="flex: 1"></div>
    <button aria-label="Ajustes" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--text2); display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
    </button>
    <div aria-label="Cuenta" role="img" style="width: 36px; height: 36px; border-radius: 50%; background: var(--accentSoft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 600">V</div>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap; gap: 24px; padding: 8px 20px 24px; box-sizing: border-box">

    <nav aria-label="Navegación" style="flex: 0 0 232px; display: flex; flex-direction: column; gap: 2px">
      <a href="#" style="height: 40px; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-radius: 12px; text-decoration: none; background: var(--accentSoft); color: var(--accent); font-weight: 600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13l2.5-7h11l2.5 7v5H4z"></path><path d="M4 13h5l1 2h4l1-2h5"></path></svg>
        <span style="flex: 1">Bandeja</span><span style="font-size: 12px">4</span>
      </a>
      <a href="#" style="height: 40px; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-radius: 12px; text-decoration: none; color: var(--text2)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>
        <span>Pospuestos</span>
      </a>
      <a href="#" style="height: 40px; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-radius: 12px; text-decoration: none; color: var(--text2)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        <span>Hechos</span>
      </a>
      <a href="#" style="height: 40px; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-radius: 12px; text-decoration: none; color: var(--text2)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19l1-4L16 5l3 3L9 18z"></path></svg>
        <span>Borradores</span>
      </a>
      <a href="#" style="height: 40px; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-radius: 12px; text-decoration: none; color: var(--text2)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-7-6 15-2.5-6z"></path></svg>
        <span>Enviados</span>
      </a>
      <a href="#" style="height: 40px; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-radius: 12px; text-decoration: none; color: var(--text2)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4v4M16 4v4M4 9h16M5 6h14v13H5z"></path></svg>
        <span>Recordatorios</span>
      </a>
      <a href="#" style="height: 40px; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-radius: 12px; text-decoration: none; color: var(--text2)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"></path></svg>
        <span>Papelera</span>
      </a>
      <div style="height: 1px; background: var(--border); margin: 12px 14px"></div>
      <div style="padding: 4px 14px 8px; font-size: 12px; font-weight: 600; color: var(--text3); letter-spacing: 0.02em">Bundles</div>
      <sc-for list="{{ bundles }}" as="b" hint-placeholder-count="5">
        <a href="#" style="height: 36px; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-radius: 12px; text-decoration: none; color: var(--text2)">
          <span style="width: 10px; height: 10px; border-radius: 4px; background: {{ b.color }}; margin: 0 4px"></span>
          <span>{{ b.label }}</span>
        </a>
      </sc-for>
    </nav>

    <main style="flex: 999 1 560px; min-width: 0; display: flex; justify-content: center">
      <div style="width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
          <section style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px">
            <h2 style="margin: 8px 4px 0; font-size: 13px; font-weight: 600; color: var(--text3)">{{ g.label }}</h2>
            <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden">
              <sc-for list="{{ g.items }}" as="item" hint-placeholder-count="3">
                <div style="height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 16px 0 14px; box-sizing: border-box; border-top: {{ item.divider }}; background: {{ item.rowBg }}">
                  <sc-if value="{{ item.isBundle }}" hint-placeholder-val="{{ false }}">
                    <div style="width: 36px; height: 36px; border-radius: 11px; background: {{ item.color }}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l8-4 8 4-8 4z"></path><path d="M4 13l8 4 8-4"></path></svg>
                    </div>
                    <div style="width: 180px; flex-shrink: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ item.name }}</div>
                    <div style="flex: 1; min-width: 0; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ item.subject }}</div>
                    <span style="font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface2); color: var(--text2)">{{ item.count }}</span>
                  </sc-if>
                  <sc-if value="{{ item.isMail }}" hint-placeholder-val="{{ true }}">
                    <div style="width: 36px; height: 36px; border-radius: 50%; background: {{ item.avatarBg }}; color: {{ item.avatarFg }}; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0">{{ item.initials }}</div>
                    <div style="width: 180px; flex-shrink: 0; font-weight: {{ item.weight }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ item.name }}</div>
                    <div style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">
                      <span style="font-weight: {{ item.weight }}">{{ item.subject }}</span>
                      <span style="color: var(--text3)"> — {{ item.snippet }}</span>
                    </div>
                  </sc-if>
                  <sc-if value="{{ item.hovered }}" hint-placeholder-val="{{ false }}">
                    <div style="display: flex; gap: 2px">
                      <button aria-label="Fijar" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: var(--text2); display: flex; align-items: center; justify-content: center; cursor: pointer">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 5 3 3H7l3-3zM12 12v8"></path></svg>
                      </button>
                      <button aria-label="Posponer" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: var(--text2); display: flex; align-items: center; justify-content: center; cursor: pointer">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>
                      </button>
                      <button aria-label="Marcar como hecho" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: var(--accentSoft); color: var(--accent); display: flex; align-items: center; justify-content: center; cursor: pointer">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
                      </button>
                    </div>
                  </sc-if>
                  <sc-if value="{{ item.showTime }}" hint-placeholder-val="{{ true }}">
                    <sc-if value="{{ item.pinned }}" hint-placeholder-val="{{ false }}">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" role="img" aria-label="Fijado" style="color: var(--accent)"><path d="M9 4h6l-1 5 3 3H7l3-3zM12 12v8"></path></svg>
                    </sc-if>
                    <span style="width: 56px; text-align: right; font-size: 12px; color: var(--text3); font-weight: {{ item.weight }}">{{ item.time }}</span>
                  </sc-if>
                </div>
              </sc-for>
            </div>
          </section>
        </sc-for>
      </div>
    </main>
  </div>

  <button aria-label="Redactar" style="position: absolute; right: 32px; bottom: 32px; width: 60px; height: 60px; border: 0; border-radius: 20px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: var(--fabShadow); cursor: pointer">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark
      ? { bg: '#111214', surface: '#18191C', surface2: '#24262A', border: '#2A2C30', text: '#ECECEE', text2: '#B0B1B6', text3: '#8E9096', accent: '#7EA6FF', accentSoft: '#1E2940', hover: '#1F2125', fabShadow: '0 8px 24px rgba(0,0,0,0.5)' }
      : { bg: '#F5F5F3', surface: '#FFFFFF', surface2: '#F1F1EE', border: '#E6E5E1', text: '#1B1B1A', text2: '#55554F', text3: '#6B6B66', accent: '#2F62E8', accentSoft: '#E9EFFD', hover: '#FAFAF8', fabShadow: '0 8px 20px rgba(47,98,232,0.28)' };
    const vars = Object.entries(t).map(([k, v]) => `--${k}: ${v};`).join(' ');
    const bc = dark
      ? { social: '#E8794A', promos: '#3BB0C2', updates: '#E5A13A', finance: '#4FB06A', travel: '#9B83F0' }
      : { social: '#D9541E', promos: '#0E8A9C', updates: '#C77C0A', finance: '#2E8B48', travel: '#6E52D8' };
    const av = (bg, fg) => dark ? { avatarBg: bg[1], avatarFg: fg[1] } : { avatarBg: bg[0], avatarFg: fg[0] };
    const rows = (items) => items.map((it, i) => ({
      isBundle: !!it.count, isMail: !it.count, hovered: !!it.hovered, showTime: !it.hovered,
      pinned: !!it.pinned, weight: it.unread ? '600' : '400',
      divider: i === 0 ? 'none' : '1px solid var(--border)',
      rowBg: it.hovered ? 'var(--hover)' : 'transparent',
      ...it,
    }));
    return {
      c: { vars },
      bundles: [
        { label: 'Social', color: bc.social },
        { label: 'Promociones', color: bc.promos },
        { label: 'Actualizaciones', color: bc.updates },
        { label: 'Finanzas', color: bc.finance },
        { label: 'Viajes', color: bc.travel },
      ],
      groups: [
        { label: 'Hoy', items: rows([
          { name: 'Laura Martín', initials: 'LM', ...av(['#E9EFFD', '#1E2940'], ['#2F62E8', '#9DBBFF']), subject: 'Revisión del onboarding', snippet: 'Te dejo los comentarios del flujo nuevo antes de la demo', time: '10:42', unread: true, pinned: true },
          { name: 'GitHub', initials: 'GH', ...av(['#EDEDEA', '#2A2C30'], ['#3A3A36', '#D6D7DB']), subject: '[reinbox] Nueva issue: modo oscuro', snippet: 'El fondo de la vista de conversación no respeta el tema', time: '09:15', unread: true, hovered: true },
          { name: 'Promociones', color: bc.promos, subject: 'Figma, Notion, Linear', count: '3 nuevos' },
          { name: 'Carlos Ruiz', initials: 'CR', ...av(['#FBEDE4', '#3A2418'], ['#B4501C', '#F0A77E']), subject: 'Cena del viernes', snippet: '¿Os viene bien a las 21:00? He reservado en el sitio de siempre', time: '08:03', unread: false },
        ]) },
        { label: 'Ayer', items: rows([
          { name: 'Actualizaciones', color: bc.updates, subject: 'Google Play Console, App Store Connect', count: '2 nuevos' },
          { name: 'Ana Gómez', initials: 'AG', ...av(['#E7F4EC', '#16301F'], ['#2E8B48', '#7FD39A']), subject: 'Contrato firmado', snippet: 'Adjunto la versión final con las dos firmas', time: 'ayer' },
          { name: 'Finanzas', color: bc.finance, subject: 'Stripe, Banco', count: '2' },
        ]) },
        { label: 'Este mes', items: rows([
          { name: 'Viajes', color: bc.travel, subject: 'Vuelo a Lisboa · 24 oct', count: '1' },
          { name: 'Marta Sanz', initials: 'MS', ...av(['#F1ECFC', '#272040'], ['#6E52D8', '#B9A7FA']), subject: 'Fotos del viaje', snippet: 'He subido el álbum compartido, mira la carpeta del día 3', time: '3 oct' },
        ]) },
      ],
    };
  }
}
</script>
</body>
</html>
