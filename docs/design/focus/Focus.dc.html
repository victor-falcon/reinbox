<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reinbox · Focus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="{{ c.vars }} width: 100%; min-height: 900px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; align-items: center; position: relative">

  <header style="width: 100%; height: 72px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 0 28px; box-sizing: border-box">
    <div style="flex: 1 1 160px; display: flex; align-items: center; gap: 10px">
      <span style="font-size: 17px; font-weight: 700; letter-spacing: -0.02em">reinbox</span>
    </div>
    <nav aria-label="Vistas" style="display: flex; gap: 4px; padding: 4px; border-radius: 16px; background: var(--surface2)">
      <a href="#" style="height: 36px; display: flex; align-items: center; padding: 0 16px; border-radius: 12px; text-decoration: none; background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow)">Bandeja</a>
      <a href="#" style="height: 36px; display: flex; align-items: center; padding: 0 16px; border-radius: 12px; text-decoration: none; color: var(--text2); font-weight: 500">Pospuestos</a>
      <a href="#" style="height: 36px; display: flex; align-items: center; padding: 0 16px; border-radius: 12px; text-decoration: none; color: var(--text2); font-weight: 500">Hechos</a>
      <a href="#" style="height: 36px; display: flex; align-items: center; padding: 0 16px; border-radius: 12px; text-decoration: none; color: var(--text2); font-weight: 500">Enviados</a>
    </nav>
    <div style="flex: 1 1 160px; display: flex; justify-content: flex-end; align-items: center; gap: 6px">
      <button aria-label="Buscar" style="width: 44px; height: 44px; border: 0; border-radius: 14px; background: transparent; color: var(--text2); display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
      </button>
      <button aria-label="Más vistas" style="width: 44px; height: 44px; border: 0; border-radius: 14px; background: transparent; color: var(--text2); display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="18" cy="12" r="1.6"></circle></svg>
      </button>
      <div aria-label="Cuenta" role="img" style="width: 36px; height: 36px; border-radius: 50%; background: var(--accentSoft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700">V</div>
    </div>
  </header>

  <main style="width: 100%; max-width: 700px; padding: 24px 20px 120px; box-sizing: border-box; display: flex; flex-direction: column; gap: 36px">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; align-items: baseline; gap: 10px; margin: 0 12px 10px">
          <h2 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">{{ g.label }}</h2>
          <span style="color: var(--text3); font-size: 13px; font-weight: 500">{{ g.sub }}</span>
        </div>
        <sc-for list="{{ g.items }}" as="item" hint-placeholder-count="3">
          <div>
            <sc-if value="{{ item.isMail }}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; gap: 14px; padding: 14px 12px; border-radius: 20px; background: {{ item.rowBg }}">
                <div style="width: 40px; height: 40px; border-radius: 50%; background: {{ item.avatarBg }}; color: {{ item.avatarFg }}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0">{{ item.initials }}</div>
                <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                  <div style="display: flex; align-items: center; gap: 8px">
                    <span style="font-weight: {{ item.weight }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ item.name }}</span>
                    <sc-if value="{{ item.pinned }}" hint-placeholder-val="{{ false }}">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" role="img" aria-label="Fijado" style="color: var(--accent); flex-shrink: 0"><path d="M9 4h6l-1 5 3 3H7l3-3zM12 12v8"></path></svg>
                    </sc-if>
                    <span style="flex: 1"></span>
                    <sc-if value="{{ item.showTime }}" hint-placeholder-val="{{ true }}">
                      <span style="font-size: 12px; color: var(--text3); font-weight: 500">{{ item.time }}</span>
                    </sc-if>
                  </div>
                  <div style="font-weight: {{ item.weight }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ item.subject }}</div>
                  <div style="color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ item.snippet }}</div>
                </div>
                <sc-if value="{{ item.hovered }}" hint-placeholder-val="{{ false }}">
                  <div style="display: flex; align-items: center; gap: 4px">
                    <button aria-label="Fijar" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: var(--surface); color: var(--text2); display: flex; align-items: center; justify-content: center; cursor: pointer">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 5 3 3H7l3-3zM12 12v8"></path></svg>
                    </button>
                    <button aria-label="Posponer" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: var(--surface); color: var(--text2); display: flex; align-items: center; justify-content: center; cursor: pointer">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>
                    </button>
                    <button aria-label="Marcar como hecho" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
                    </button>
                  </div>
                </sc-if>
              </div>
            </sc-if>
            <sc-if value="{{ item.isBundle }}" hint-placeholder-val="{{ false }}">
              <div style="margin: 6px 0; padding: 16px; border-radius: 22px; background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px">
                <div style="display: flex; align-items: center; gap: 12px">
                  <div style="width: 32px; height: 32px; border-radius: 10px; background: {{ item.color }}; display: flex; align-items: center; justify-content: center">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l8-4 8 4-8 4z"></path><path d="M4 13l8 4 8-4"></path></svg>
                  </div>
                  <span style="font-weight: 700; font-size: 15px">{{ item.name }}</span>
                  <span style="color: var(--text3); font-weight: 500">{{ item.count }}</span>
                  <span style="flex: 1"></span>
                  <button aria-label="Marcar bundle como hecho" style="height: 34px; padding: 0 14px; border: 1px solid var(--border); border-radius: 12px; background: transparent; color: var(--text2); font: inherit; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
                    Todo hecho
                  </button>
                </div>
                <div style="display: flex; flex-direction: column; gap: 2px; padding-left: 44px">
                  <sc-for list="{{ item.entries }}" as="e" hint-placeholder-count="3">
                    <div style="display: flex; gap: 12px; padding: 6px 0; min-width: 0">
                      <span style="width: 120px; flex-shrink: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ e.from }}</span>
                      <span style="flex: 1; min-width: 0; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ e.subject }}</span>
                    </div>
                  </sc-for>
                </div>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </section>
    </sc-for>
  </main>

  <button aria-label="Redactar" style="position: absolute; right: 36px; bottom: 36px; width: 60px; height: 60px; border: 0; border-radius: 50%; background: var(--text); color: var(--bg); display: flex; align-items: center; justify-content: center; box-shadow: var(--fabShadow); cursor: pointer">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19l1-4L16 5l3 3L9 18z"></path></svg>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark
      ? { bg: '#121110', surface: '#1C1B19', surface2: '#1F1E1C', border: '#2C2A27', text: '#F0EDE8', text2: '#B3AEA6', text3: '#8F8A82', accent: '#F28B4B', accentSoft: '#3A2416', hover: '#1E1D1B', shadow: '0 1px 2px rgba(0,0,0,0.4)', fabShadow: '0 10px 28px rgba(0,0,0,0.55)' }
      : { bg: '#FBFAF8', surface: '#FFFFFF', surface2: '#F1EFEB', border: '#E9E6E1', text: '#1C1A17', text2: '#5E5A53', text3: '#77726A', accent: '#C2410C', accentSoft: '#FCEBDF', hover: '#F3F1ED', shadow: '0 1px 2px rgba(28,26,23,0.08)', fabShadow: '0 10px 24px rgba(28,26,23,0.22)' };
    const vars = Object.entries(t).map(([k, v]) => `--${k}: ${v};`).join(' ');
    const bc = dark
      ? { promos: '#4AA8E0', updates: '#E5A13A' }
      : { promos: '#1F7FC0', updates: '#B86E00' };
    const av = (bg, fg) => dark ? { avatarBg: bg[1], avatarFg: fg[1] } : { avatarBg: bg[0], avatarFg: fg[0] };
    const rows = (items) => items.map((it) => ({
      isBundle: !!it.entries, isMail: !it.entries, hovered: !!it.hovered, showTime: !it.hovered,
      pinned: !!it.pinned, weight: it.unread ? '700' : '500',
      rowBg: it.hovered ? 'var(--hover)' : 'transparent',
      ...it,
    }));
    return {
      c: { vars },
      groups: [
        { label: 'Hoy', sub: 'martes, 14 de octubre', items: rows([
          { name: 'Laura Martín', initials: 'LM', ...av(['#FCEBDF', '#3A2416'], ['#C2410C', '#F6B48A']), subject: 'Revisión del onboarding', snippet: 'Te dejo los comentarios del flujo nuevo antes de la demo del jueves', time: '10:42', unread: true, pinned: true },
          { name: 'GitHub', initials: 'GH', ...av(['#EEECE8', '#2C2A27'], ['#3D3A35', '#DAD5CD']), subject: '[reinbox] Nueva issue: modo oscuro', snippet: 'El fondo de la vista de conversación no respeta el tema del sistema', time: '09:15', unread: true, hovered: true },
          { name: 'Promociones', color: bc.promos, count: '3 nuevos', entries: [
            { from: 'Figma', subject: 'Novedades de Config: lo que te perdiste' },
            { from: 'Notion', subject: 'Plantillas nuevas para tu equipo' },
            { from: 'Linear', subject: 'Changelog de octubre' },
          ] },
        ]) },
        { label: 'Ayer', sub: 'lunes, 13 de octubre', items: rows([
          { name: 'Ana Gómez', initials: 'AG', ...av(['#E7F4EC', '#16301F'], ['#2E8B48', '#7FD39A']), subject: 'Contrato firmado', snippet: 'Adjunto la versión final con las dos firmas', time: 'ayer' },
          { name: 'Actualizaciones', color: bc.updates, count: '2', entries: [
            { from: 'Google Play', subject: 'Tu app está lista para publicar' },
            { from: 'App Store', subject: 'Resumen semanal de analíticas' },
          ] },
        ]) },
      ],
    };
  }
}
</script>
</body>
</html>
